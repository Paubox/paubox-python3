name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # 3.8 is the floor declared in setup.py, and ubuntu-latest no longer ships it.
          - python-version: "3.8"
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Smoke test the installed package
        # Run outside the checkout so this imports the installed distribution
        # rather than the local ./paubox directory.
        working-directory: ${{ runner.temp }}
        run: python -c "from paubox import PauboxApiClient, PauboxFormsClient, Response"

      - name: Run unit tests
        # tests/test_paubox.py is excluded, not skipped: it reads the gitignored
        # tests/config.cfg at import time and sends live mail. It belongs to the
        # credentialed suite, not to CI.
        run: >-
          pytest tests
          --ignore=tests/test_paubox.py
          --junitxml=junit-${{ matrix.python-version }}.xml
          -v

      - name: Assert the suite actually executed
        run: python .github/scripts/assert_tests_ran.py junit-${{ matrix.python-version }}.xml

  route-check:
    name: Base URLs are routed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      # Read the real constants, so a base URL change cannot pass unprobed.
      - name: Probe the base URLs the clients use
        run: |
          # The webhooks base is probed with /endpoints appended. The gateway
          # scopes its rule to that one resource so the producers' event-ingest
          # route stays off the public host, which leaves the bare base
          # unrouted by design — probing it directly would fail this check for
          # a URL the client never requests on its own.
          python -c 'from paubox.paubox import PAUBOX_API_BASE_URL as e; from paubox.forms import FORMS_BASE_URL as f; from paubox.webhooks import WEBHOOKS_BASE_URL as w; print(e); print(f); print(w + "/endpoints")' \
            | .github/scripts/route-check.sh
