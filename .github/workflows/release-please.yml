name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a release PR that bumps `version` in setup.py and writes
      # CHANGELOG.md. Merging that PR creates the tag and the GitHub release.
      #
      # The manifest is seeded from PyPI (1.0.1), not from setup.py. setup.py
      # spent a while claiming 1.3.0, but 1.1.0 through 1.3.0 were never
      # uploaded, so seeding from the repo would have skipped three version
      # numbers that are still free to use.
      #
      # include-component-in-tag is false so tags stay bare `vX.Y.Z`, matching
      # the existing v1.0.0 and v1.0.1 tags and the rest of the SDK fleet.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the artifacts
        # Catches the metadata problems PyPI rejects at upload time. Nothing is
        # published here; this only proves the distribution would be accepted.
        run: twine check --strict dist/*

      - name: Install the built wheel
        # Everything below reads the installed distribution rather than the
        # checkout, so the version and the import surface are checked against
        # the artifact that would actually be uploaded.
        run: pip install dist/*.whl

      - name: Verify the built version matches the tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          BUILT=$(python -c "import importlib.metadata as m; print(m.version('paubox-python3'))")
          if [ "v${BUILT}" != "${RELEASE_TAG}" ]; then
            echo "::error::built distribution is ${BUILT} but the tag is ${RELEASE_TAG}"
            exit 1
          fi
          echo "built distribution ${BUILT} matches ${RELEASE_TAG}"

      - name: Smoke test the installed package
        # Run outside the checkout so this imports the installed distribution
        # rather than the local ./paubox directory.
        working-directory: ${{ runner.temp }}
        run: python -c "from paubox import PauboxApiClient, PauboxFormsClient, Response"

      - name: Run unit tests
        # tests/test_paubox.py is excluded, not skipped: it reads the gitignored
        # tests/config.cfg at import time and sends live mail. It belongs to the
        # credentialed suite, not to CI.
        run: >-
          pytest tests
          --ignore=tests/test_paubox.py
          --junitxml=junit-release.xml
          -v

      - name: Assert the suite actually executed
        run: python .github/scripts/assert_tests_ran.py junit-release.xml
